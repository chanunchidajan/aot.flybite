<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOT FLYBITE</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #0066cc;
            --primary-dark: #004c99;
            --bg-light: #f4f7f9;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px 0;
        }

        .mobile-container {
            width: 100%;
            max-width: 412px;
            height: 840px;
            background-color: var(--bg-light);
            border-radius: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 8px solid #334155;
        }

        .header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-color);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .lang-switch {
            display: flex;
            background-color: #e2e8f0;
            border-radius: 20px;
            padding: 2px;
        }

        .lang-btn {
            border: none;
            background: transparent;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer;
            color: var(--text-sub);
        }

        .lang-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            position: relative;
        }

        /* ซ่อนทุกหน้า และแสดงเฉพาะหน้าที่มี class .active */
        .page {
            display: none !important;
        }

        .page.active {
            display: block !important;
        }

        .page-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .user-card {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            background-color: white;
            color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            background-color: white;
            outline: none;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: block;
            text-align: center;
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            color: var(--text-sub);
            border: 1px dashed var(--text-sub);
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
            display: block;
            text-align: center;
        }

        .btn-social {
            width: 100%;
            padding: 12px;
            background-color: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .food-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .food-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
        }

        .food-img {
            width: 100%;
            height: 105px;
            object-fit: cover;
        }

        .food-info {
            padding: 10px;
        }

        .food-title {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .bottom-nav {
            background-color: var(--card-bg);
            display: none;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid var(--border-color);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.7rem;
            cursor: pointer;
            width: 20%;
        }

        .nav-item i {
            font-size: 1.2rem;
        }

        .nav-item.active {
            color: var(--primary-color);
            font-weight: 500;
        }

        .menu-list {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <div class="header">
            <div class="brand-logo">
                <i class="fa-solid fa-plane-departure"></i>
                <span>AOT FLYBITE</span>
            </div>
            <div class="lang-switch">
                <button type="button" class="lang-btn active" id="btn-th">TH</button>
                <button type="button" class="lang-btn" id="btn-en">EN</button>
            </div>
        </div>

        <div class="content-area">

            <!-- 1. LOGIN -->
            <div id="page-login" class="page active">
                <h2 class="page-title">เข้าสู่ระบบ</h2>
                <button type="button" class="btn-social" id="btn-google">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="google">
                    <span>Continue with Google</span>
                </button>
                
                <div class="form-group">
                    <label>อีเมล</label>
                    <input type="email" id="input-email" class="form-control" value="pongsakorn@example.com">
                </div>
                <div class="form-group">
                    <label>รหัสผ่าน</label>
                    <input type="password" id="input-pass" class="form-control" value="12345678">
                </div>
                
                <button type="button" class="btn-primary" id="btn-submit-login">เข้าสู่ระบบ</button>
                <button type="button" class="btn-secondary" id="btn-guest-login">ใช้งานโดยไม่เข้าสู่ระบบ</button>
            </div>

            <!-- 2. HOME -->
            <div id="page-home" class="page">
                <h2 class="page-title">ร้านอาหารแนะนำ</h2>
                <div class="food-grid">
                    <div class="food-card" id="food-item-1">
                        <img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=400" class="food-img" alt="Noodle">
                        <div class="food-info">
                            <div class="food-title">เรือนนมสด</div>
                            <span style="font-size:0.8rem; color:var(--primary-color);">฿150</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. FLIGHT -->
            <div id="page-flight" class="page">
                <h2 class="page-title">ข้อมูลเที่ยวบิน</h2>
                <div class="form-group">
                    <label>หมายเลขเที่ยวบิน</label>
                    <input type="text" class="form-control" value="TG102">
                </div>
            </div>

            <!-- 4. NOTIFICATIONS -->
            <div id="page-notifications" class="page">
                <h2 class="page-title">การแจ้งเตือน</h2>
                <p style="color:var(--text-sub); font-size:0.9rem;">ไม่มีการแจ้งเตือนใหม่</p>
            </div>

            <!-- 5. PROFILE -->
            <div id="page-profile" class="page">
                <h2 class="page-title">บัญชีของฉัน</h2>
                <div class="user-card">
                    <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
                    <div>
                        <h3 id="user-display-name">User</h3>
                        <p id="user-display-email" style="font-size: 0.8rem; opacity: 0.8;">user@example.com</p>
                    </div>
                </div>
                <div class="menu-list">
                    <div class="menu-item" id="btn-logout" style="color:red;">
                        <span>ออกจากระบบ</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav" id="main-nav">
            <a class="nav-item active" id="nav-home">
                <i class="fa-solid fa-house"></i>
                <span>แนะนำ</span>
            </a>
            <a class="nav-item" id="nav-flight">
                <i class="fa-solid fa-plane"></i>
                <span>เที่ยวบิน</span>
            </a>
            <a class="nav-item" id="nav-notif">
                <i class="fa-solid fa-bell"></i>
                <span>แจ้งเตือน</span>
            </a>
            <a class="nav-item" id="nav-profile">
                <i class="fa-solid fa-user"></i>
                <span>บัญชี</span>
            </a>
        </div>
    </div>

    <script>
        // ฟังก์ชันสลับหน้าหลัก
        function goToPage(pageId) {
            console.log("Navigating to:", pageId);
            const pages = document.querySelectorAll('.page');
            pages.forEach(p => p.classList.remove('active'));
            
            const target = document.getElementById(pageId);
            if(target) {
                target.classList.add('active');
            } else {
                console.error("Target page not found:", pageId);
            }
        }

        // รอให้ HTML โหลดจบก่อนผูกปุ่ม
        document.addEventListener("DOMContentLoaded", function() {
            
            // ปุ่มเข้าสู่ระบบ
            document.getElementById('btn-submit-login').addEventListener('click', function() {
                const email = document.getElementById('input-email').value || 'pongsakorn@example.com';
                document.getElementById('user-display-name').textContent = email.split('@')[0];
                document.getElementById('user-display-email').textContent = email;
                document.getElementById('main-nav').style.display = 'flex';
                goToPage('page-home');
            });

            // ปุ่มใช้งานโดยไม่เข้าสู่ระบบ
            document.getElementById('btn-guest-login').addEventListener('click', function() {
                document.getElementById('user-display-name').textContent = 'Guest User';
                document.getElementById('user-display-email').textContent = 'guest@aot.com';
                document.getElementById('main-nav').style.display = 'flex';
                goToPage('page-home');
            });

            // ปุ่ม Google Login
            document.getElementById('btn-google').addEventListener('click', function() {
                document.getElementById('btn-guest-login').click();
            });

            // ปุ่ม เมนูด้านล่าง (Bottom Nav)
            document.getElementById('nav-home').addEventListener('click', function() {
                setActiveNav(this);
                goToPage('page-home');
            });

            document.getElementById('nav-flight').addEventListener('click', function() {
                setActiveNav(this);
                goToPage('page-flight');
            });

            document.getElementById('nav-notif').addEventListener('click', function() {
                setActiveNav(this);
                goToPage('page-notifications');
            });

            document.getElementById('nav-profile').addEventListener('click', function() {
                setActiveNav(this);
                goToPage('page-profile');
            });

            // ปุ่ม Logout
            document.getElementById('btn-logout').addEventListener('click', function() {
                document.getElementById('main-nav').style.display = 'none';
                goToPage('page-login');
            });

            function setActiveNav(element) {
                document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
                element.classList.add('active');
            }
        });
    </script>
</body>
</html>
